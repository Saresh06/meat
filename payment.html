<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payment</title>
    <link rel="stylesheet" href="pay.css">
    <script src="https://kit.fontawesome.com/16a2d7a5b2.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- overall -->
    <section>

        <!-- navbar -->
        <nav>
            <div class="nav_head">
                <img src="./assest/logo1.png" alt="">
                <h1 class="inter">MeaT</h1>
            </div>
            <div class="nav_add" onclick="map()">
                <i class="fa-solid fa-location-dot"></i>
                <div class="pop">
                    <h4>Address</h4>
                    <p>velachery,vijay nagar busstop 600056</p>
                </div>
            </div>
            <input type="radio" id="check">
            <label for="check"><i class="fa-solid fa-bars"></i></label>
            <div class="nav_menu pop">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#product">Product</a>
                <a href="#service">Services</a>
                <a href="#shop">Shop</a>
                <a href="#contact">Contact us</a>
            </div>
            <i class="fa-solid fa-cart-plus"></i>

            <i class="fa-solid fa-circle-user"></i>
        </nav>

        <!-- payment -->
        <div id="payment">
            <h2>Payment Method</h2>

            <div class="overall">
                <div class="online">
                    <div class="show">
                        <div>
                            <input type="radio" id="name" name="amount" onclick="show(this)">
                            <label for="name"><h2>Card payment</h2></label>
                        </div>

                        <div>

                            <i class="fa-solid fa-greater-than"></i>
                        </div>
                    </div>

                    <div class="amount" >
                        <img src="./assest/gpay.png" alt="" class="img">
                        <img src="./assest/pe.png" alt="" class="img">
                        <img src="./assest/paytem.png" alt="" class="img">
                        <img src="./assest/amazon.png" alt="" class="img">
                    </div>
                </div>
                <div class="cash">
                    <div class="show">
                        <div>
                            <input type="radio" id="name1" name="amount"  onclick="show(this)">
                            <label for="name1"><h2>Cash on delivery</h2></label>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </section>

    <script src="pay.js"></script>
</body>

</html>
